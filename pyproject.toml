[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asc-screens"
version = "0.1.0"
description = "Frame screenshots for App Store Connect."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
asc-screens = "asc_screens:main"

[tool.setuptools]
py-modules = ["asc_screens", "asc_frame_maker"]
